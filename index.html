<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>발표 피드백</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <main id="participant" class="page">
    <header class="page-head">
      <p class="org">송도지구 지구모임</p>
      <h1>발표 피드백</h1>
      <p class="when">10월 5일(월)</p>
      <p class="help">쓰는 내용은 이 폰에 바로 저장돼요. 다시 열 때는 처음 연 카톡 링크로 열어 주세요.</p>
      <p class="warning" id="storage-warning" hidden>이 브라우저는 저장이 안 돼요. 다 쓰면 아래 제출하기를 눌러 주세요.</p>
    </header>

    <nav class="chips" id="chips" aria-label="주제 바로가기"></nav>

    <div class="field name-field">
      <label for="name">이름 <span class="optional">(선택)</span></label>
      <input id="name" maxlength="30" autocomplete="name">
    </div>

    <div id="topics"></div>

    <div class="submit-area">
      <button type="button" class="btn btn-primary" id="submit">제출하기</button>
      <p class="form-msg" id="submit-msg" aria-live="polite"></p>
    </div>

    <footer class="page-foot"><a href="#admin">관리자</a></footer>
  </main>

  <main id="admin" class="page" hidden>
    <header class="page-head">
      <a class="back" href="#">참석자 화면으로</a>
      <h1>관리자</h1>
    </header>

    <form id="login" class="login">
      <div class="field">
        <label for="pin">비밀번호</label>
        <input id="pin" type="password" inputmode="numeric" autocomplete="off">
      </div>
      <button type="submit" class="btn btn-primary">열기</button>
      <p class="form-msg" id="login-msg" aria-live="polite"></p>
    </form>

    <div id="admin-body" hidden>
      <section class="panel">
        <h2>공유</h2>
        <p class="share-url" id="share-url"></p>
        <button type="button" class="btn" id="copy-link">링크 복사</button>
        <img class="qr" id="qr" alt="참석자 화면으로 가는 QR 코드" width="200" height="200" hidden>
      </section>

      <section class="panel">
        <h2>주제와 발표자</h2>
        <form id="presenters">
          <div id="presenter-fields"></div>
          <button type="submit" class="btn btn-primary">저장</button>
          <p class="form-msg" id="presenter-msg" aria-live="polite"></p>
        </form>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>피드백</h2>
          <button type="button" class="btn" id="refresh">새로고침</button>
        </div>
        <p class="form-msg" id="results-msg" aria-live="polite"></p>
        <div id="results"></div>
      </section>
    </div>
  </main>
</body>
</html>
